<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageHeadTitle">三年一班 智慧大電視聯絡簿</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC, Noto Serif TC, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #fcfaf6;
      --card-bg: #ffffff;
      --border-soft: #ece7de;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    /* 預設高清晰標準繁體黑體：微軟正黑體 / 蘋方 / Noto Sans TC */
    body.font-sans-mode {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }

    /* 標楷體模式（適合低年級國字筆畫教學） */
    body.font-kai-mode {
      font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", "Noto Serif TC", serif;
    }

    /* 圓體模式 */
    body.font-round-mode {
      font-family: "Yuanti SC", "Microsoft YaHei", "Noto Sans TC", sans-serif;
    }

    /* 深色護眼黑板主題 */
    body.theme-chalkboard {
      --bg-page: #14241d;
      --card-bg: #1c362b;
      --border-soft: #2a4c3d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
      letter-spacing: -0.01em;
    }

    .font-clock {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace;
    }

    /* 大電視字體尺寸調控 */
    /* 左側作業卡片字級 */
    .tv-scale-lg .hw-item-text { font-size: 1.35rem; line-height: 2rem; }
    .tv-scale-xl .hw-item-text { font-size: 1.75rem; line-height: 2.5rem; }
    .tv-scale-2xl .hw-item-text { font-size: 2.15rem; line-height: 3rem; }

    /* 右側必備用具與提醒事項專屬字級（優化分行與閱讀節奏，避免尷尬斷字） */
    .tv-scale-lg .side-item-text { font-size: 1.15rem; line-height: 1.75rem; }
    .tv-scale-xl .side-item-text { font-size: 1.45rem; line-height: 2.15rem; }
    .tv-scale-2xl .side-item-text { font-size: 1.75rem; line-height: 2.55rem; }

    .tv-scale-lg .card-title { font-size: 1.45rem; }
    .tv-scale-xl .card-title { font-size: 1.75rem; }
    .tv-scale-2xl .card-title { font-size: 2.1rem; }

    /* 注音拼音排版樣式 */
    ruby {
      ruby-align: center;
      ruby-position: over;
    }
    rt {
      font-size: 0.52em;
      letter-spacing: 0.04em;
      color: currentColor;
      opacity: 0.88;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    }
    body.no-zhuyin rt {
      display: none !important;
    }

    /* 科目彩色膠囊標籤 */
    .subject-tag-chinese { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .subject-tag-math { background-color: #dbeafe; color: #2563eb; border: 1px solid #bfdbfe; }
    .subject-tag-english { background-color: #ccfbf1; color: #0d9488; border: 1px solid #99f6e4; }
    .subject-tag-science { background-color: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .subject-tag-social { background-color: #ffedd5; color: #ea580c; border: 1px solid #fed7aa; }
    .subject-tag-art { background-color: #f3e8ff; color: #9333ea; border: 1px solid #e9d5ff; }
    .subject-tag-life { background-color: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .subject-tag-read { background-color: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
    .subject-tag-default { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
  </style>
</head>

<body class="font-sans-mode tv-scale-xl no-zhuyin min-h-screen flex flex-col p-4 md:p-6 select-none">
  <script>
    const DEFAULT_BOARD_DATA = {
      title: "三年一班 智慧大電視聯絡簿",
      duties: "5號、6號",
      lifeGoal: "保持微笑，友愛同學，自主學習",
      noticeBanner: "明天全校防災演練，請於 7:50 前準時到校並穿著運動服裝！",
      homework: [
        { id: "h1", subject: "國語", content: "國語習作第 42 至 45 頁並確實訂正", visible: true },
        { id: "h2", subject: "數學", content: "數學習作第 38 頁 ( 完成第四單元練習 )", visible: true },
        { id: "h3", subject: "英語", content: "複習 Unit 3 單字音檔並簽名", visible: true }
      ],
      supplies: [
        { id: "s1", content: "藝術用具 ( 剪刀、白膠、旋轉蠟筆 )", visible: true },
        { id: "s2", content: "水壺 ( 請裝滿溫開水 )", visible: true }
      ],
      notices: [
        { id: "n1", content: "明早 8:00 前完成交聯絡簿與作業。", visible: true },
        { id: "n2", content: "天氣早晚溫差大，出門請攜帶薄外套。", visible: true }
      ]
    };

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    const WEEKDAYS_ZH = ["日", "一", "二", "三", "四", "五", "六"];

    window.appState = {
      theme: 'light',
      scale: 'xl',
      fontMode: 'sans',
      zhuyinEnabled: false,
      currentDate: getTodayString(),
      records: {
        [getTodayString()]: JSON.parse(JSON.stringify(DEFAULT_BOARD_DATA))
      },
      calendarYear: new Date().getFullYear(),
      calendarMonth: new Date().getMonth()
    };
  </script>

  <!-- 頂部導覽列 -->
  <header class="bg-white rounded-3xl shadow-sm border p-4 md:p-5 mb-4 flex flex-wrap items-center justify-between gap-4" style="border-color: var(--border-soft);">
    <!-- 班級大標題與月曆按鈕 -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center gap-3">
        <!-- 橘黃色書本圖示 -->
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-500 shadow-md flex items-center justify-center text-white text-2xl flex-shrink-0">
          📖
        </div>
        <h1 id="mainTitleDisplay" class="text-3xl md:text-4xl font-black tracking-tight text-slate-800 flex items-center gap-3">
          三年一班 智慧大電視聯絡簿
        </h1>
        <!-- 即時連線狀態膠囊標籤 -->
        <div id="syncBadge" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-200 shadow-sm">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="syncText">即時連線中</span>
        </div>
      </div>

      <!-- 日期顯示與月曆切換按鈕 -->
      <div class="flex items-center gap-3 text-slate-600 font-bold text-base md:text-lg pl-1">
        <span id="dateFullDisplay">載入中...</span>
        <div class="relative inline-block">
          <button id="calendarToggleBtn" onclick="toggleCalendarModal()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm font-bold transition shadow-xs">
            <span>📅 月曆 (今天)</span>
            <span class="text-xs">▼</span>
          </button>

          <!-- 互動式月曆浮動選單（週六、日預設紅色字體） -->
          <div id="calendarModal" class="hidden absolute left-0 top-11 z-50 w-80 bg-white rounded-2xl shadow-2xl border p-4 text-slate-800" style="border-color: #cbd5e1;">
            <div class="flex items-center justify-between pb-3 mb-2 border-b">
              <button onclick="changeCalMonth(-1)" class="p-1.5 rounded-lg hover:bg-slate-100 text-lg font-bold">◀</button>
              <div class="flex items-center gap-1 font-bold">
                <select id="calYearSelect" onchange="onYearMonthChange()" class="p-1 border rounded bg-slate-50 text-sm"></select>
                <select id="calMonthSelect" onchange="onYearMonthChange()" class="p-1 border rounded bg-slate-50 text-sm"></select>
              </div>
              <button onclick="changeCalMonth(1)" class="p-1.5 rounded-lg hover:bg-slate-100 text-lg font-bold">▶</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center font-bold text-sm mb-2">
              <span class="text-red-500">日</span>
              <span>一</span>
              <span>二</span>
              <span>三</span>
              <span>四</span>
              <span>五</span>
              <span class="text-red-500">六</span>
            </div>
            <div id="calendarDaysGrid" class="grid grid-cols-7 gap-1 text-center text-base"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側功能切換按鈕群組與電子時鐘 -->
    <div class="flex flex-wrap items-center gap-2.5">
      <!-- 數位電子時鐘 -->
      <div class="bg-slate-100/90 border border-slate-200/80 rounded-2xl px-4 py-2 font-clock font-bold text-2xl tracking-wider text-slate-800 shadow-inner flex items-center justify-center">
        <span id="digitalClock">00:15:54</span>
      </div>

      <!-- 注音開關按鈕（預設關閉） -->
      <button id="zhuyinBtn" onclick="toggleZhuyin()" class="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-base transition shadow-sm">
        <span class="text-sm">文<sub class="text-[10px]">A</sub></span>
        <span id="zhuyinStatusText">注音：關</span>
      </button>

      <!-- 字體風格切換按鈕 (黑體 / 標楷體 / 圓體) -->
      <button onclick="cycleFontFamily()" class="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-base transition shadow-sm" title="切換字型">
        <span>🔤</span>
        <span>字體：<span id="fontTypeLabel">黑體</span></span>
      </button>

      <!-- 字級大小縮放按鈕 (大 / 特大 / 超大) -->
      <button onclick="cycleTextScale()" class="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-base transition shadow-sm">
        <span>🔍</span>
        <span>大小：<span id="scaleLabel">特大</span></span>
      </button>

      <!-- 黑板模式切換按鈕 -->
      <button onclick="toggleTheme()" class="p-2.5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-lg transition shadow-sm" title="切換黑板/米白模式">
        🌙
      </button>

      <!-- 全螢幕切換按鈕 -->
      <button onclick="toggleFullscreen()" class="p-2.5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-lg transition shadow-sm" title="全螢幕切換">
        ⛶
      </button>

      <!-- 教師專區登入按鈕 -->
      <button onclick="openTeacherAuthModal()" class="flex items-center gap-1.5 px-5 py-2.5 rounded-2xl font-black text-base bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white shadow-md hover:shadow-lg transition">
        <span>🔒</span>
        <span>教師專區</span>
      </button>
    </div>
  </header>

  <!-- 今日重大提醒紅色醒目橫幅 -->
  <section id="noticeBannerSection" class="mb-5 rounded-3xl p-3 md:p-3.5 bg-gradient-to-r from-red-600 via-rose-600 to-red-600 text-white shadow-md flex items-center gap-3.5 min-h-[60px]">
    <div class="flex-shrink-0 px-4 py-2 rounded-2xl bg-white/20 backdrop-blur-sm font-black text-base md:text-lg tracking-wider flex items-center gap-2 border border-white/30 shadow-inner">
      <span>📢</span> 今日重大提醒
    </div>
    <div id="noticeBannerText" class="flex-1 font-black text-lg md:text-2xl tracking-wide truncate text-white/95"></div>
  </section>

  <!-- 看板主體 -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
    <!-- 左側欄位：今日作業 + 值日生與生活目標 -->
    <div class="lg:col-span-7 flex flex-col gap-5">
      <!-- 今日作業主卡片 -->
      <section class="bg-white rounded-3xl p-6 border shadow-sm flex-1 flex flex-col" style="border-color: var(--border-soft);">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
          <div class="flex items-center gap-3">
            <span class="w-2.5 h-8 bg-blue-600 rounded-full inline-block"></span>
            <h2 class="card-title font-black text-slate-800 tracking-tight">今日聯絡簿作業</h2>
          </div>
          <span id="hwCountBadge" class="px-3 py-1 rounded-full text-sm font-bold bg-blue-50 text-blue-600 border border-blue-100">
            共 3 項
          </span>
        </div>

        <!-- 作業清單容器 -->
        <div id="homeworkContainer" class="flex-1 space-y-3.5 flex flex-col justify-start"></div>
      </section>

      <!-- 左側下方雙卡片：值日生座號 與 本週生活目標 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- 值日生座號卡片 (榮譽徽章 🎖️) -->
        <div class="bg-white rounded-3xl p-4 border shadow-sm flex items-center gap-3.5" style="border-color: var(--border-soft);">
          <div class="w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-2xl flex-shrink-0 shadow-xs">
            🎖️
          </div>
          <div class="flex flex-col">
            <span class="text-xs font-bold text-slate-400">值日生座號</span>
            <span id="dutiesDisplay" class="text-xl md:text-2xl font-black text-slate-800">5號、6號</span>
          </div>
        </div>

        <!-- 本週生活目標卡片 (目標標靶 🎯) -->
        <div class="bg-white rounded-3xl p-4 border shadow-sm flex items-center gap-3.5" style="border-color: var(--border-soft);">
          <div class="w-12 h-12 rounded-2xl bg-purple-50 border border-purple-200 flex items-center justify-center text-2xl flex-shrink-0 shadow-xs">
            🎯
          </div>
          <div class="flex flex-col">
            <span class="text-xs font-bold text-slate-400">本週生活目標</span>
            <span id="lifeGoalDisplay" class="text-xl md:text-2xl font-black text-slate-800">保持微笑，友愛同學，自主學習</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側欄位：明日必備用具 與 生活提醒與交代事項 -->
    <div class="lg:col-span-5 flex flex-col gap-5">
      <!-- 明日必備用具 -->
      <section class="bg-white rounded-3xl p-6 border shadow-sm flex flex-col" style="border-color: var(--border-soft);">
        <div class="flex items-center gap-3 pb-3 mb-3 border-b border-slate-100">
          <span class="w-2.5 h-8 bg-amber-500 rounded-full inline-block"></span>
          <h2 class="card-title font-black text-slate-800 tracking-tight">明日必備用具</h2>
        </div>
        <div id="suppliesContainer" class="flex-1 space-y-3"></div>
      </section>

      <!-- 生活提醒與交代事項 -->
      <section class="bg-white rounded-3xl p-6 border shadow-sm flex-1 flex flex-col" style="border-color: var(--border-soft);">
        <div class="flex items-center gap-3 pb-3 mb-3 border-b border-slate-100">
          <span class="w-2.5 h-8 bg-emerald-500 rounded-full inline-block"></span>
          <h2 class="card-title font-black text-slate-800 tracking-tight">生活提醒與交代事項</h2>
        </div>
        <div id="noticesContainer" class="flex-1 space-y-3"></div>
      </section>
    </div>
  </main>

  <!-- 教師登入驗證彈窗 -->
  <div id="authModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl text-slate-800 border border-slate-100">
      <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-3xl">
        🔒
      </div>
      <h3 class="text-2xl font-black text-center mb-1">進入教師專區</h3>
      <p class="text-sm text-center text-slate-400 mb-4">請輸入密碼以編輯看板內容</p>
      
      <input type="password" id="authPwdInput" placeholder="請輸入管理密碼" class="w-full px-4 py-3 border border-slate-300 rounded-2xl mb-2 text-center text-xl tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50" />
      <div id="authErrorMsg" class="hidden text-rose-500 text-sm font-bold text-center mb-3">密碼錯誤，請重新輸入！</div>

      <div class="flex gap-2.5 pt-2">
        <button onclick="closeTeacherAuthModal()" class="flex-1 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 transition">取消</button>
        <button onclick="verifyTeacherPwd()" class="flex-1 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 font-black text-white shadow-md transition">確認進入</button>
      </div>
    </div>
  </div>

  <!-- 教師專區後台編輯彈窗 -->
  <div id="editorModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 md:p-6">
    <div class="bg-white rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col shadow-2xl text-slate-800 overflow-hidden border border-slate-100">
      <div class="flex items-center justify-between p-5 border-b bg-slate-50">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">🛠️</span>
          <h3 class="text-xl font-black text-slate-800">
            教師專區：編輯聯絡簿內容
          </h3>
          <span id="editorDateBadge" class="text-sm px-3 py-1 rounded-full font-bold bg-blue-100 text-blue-700"></span>
        </div>
        <button onclick="closeEditorModal()" class="p-1 text-slate-400 hover:text-slate-600 font-bold text-2xl">✕</button>
      </div>

      <div class="p-5 md:p-6 overflow-y-auto space-y-6 flex-1 text-base">
        <!-- 自訂看板大標題欄位 -->
        <div class="bg-amber-50/60 p-4 rounded-2xl border border-amber-200/80">
          <label class="block font-bold mb-1.5 text-amber-800 flex items-center gap-1.5">
            <span>🏷️ 班級聯絡簿標題</span>
            <span class="text-xs text-amber-600/80 font-normal">（可自訂班級名稱與標題，例：三年一班 智慧大電視聯絡簿）</span>
          </label>
          <input type="text" id="editBoardTitle" placeholder="例如：三年一班 智慧大電視聯絡簿" class="w-full px-3.5 py-2.5 border border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white font-bold text-slate-800" />
        </div>

        <!-- 今日重大提醒編輯欄位 -->
        <div>
          <label class="block font-bold mb-1 text-rose-600 flex items-center gap-1.5">
            <span>📢 今日重大提醒</span>
            <span class="text-xs text-slate-400 font-normal">（文字將以大字體呈現在頂端紅色橫幅中）</span>
          </label>
          <input type="text" id="editNoticeBanner" placeholder="例如：明天穿運動服、下週一全校防災演練..." class="w-full px-3.5 py-2.5 border rounded-xl focus:outline-blue-500 bg-slate-50" />
        </div>

        <!-- 值日生座號 與 本週生活目標 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold mb-1 text-slate-700">🎖️ 值日生座號</label>
            <input type="text" id="editDuties" placeholder="例如：5號、6號" class="w-full px-3.5 py-2.5 border rounded-xl focus:outline-blue-500 bg-slate-50" />
          </div>
          <div>
            <label class="block font-bold mb-1 text-purple-700">🎯 本週生活目標</label>
            <input type="text" id="editLifeGoal" placeholder="例如：保持微笑，友愛同學，自主學習" class="w-full px-3.5 py-2.5 border rounded-xl focus:outline-blue-500 bg-slate-50" />
          </div>
        </div>

        <!-- 今日作業清單編輯（含顯示勾選開關） -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="font-bold flex items-center gap-1.5 text-blue-600">
              <span>✏️ 今日作業</span>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA31S3iEZqJbgOo2PGNH_YwsfKJ9jIcQh0",
      authDomain: "my-class-tv.firebaseapp.com",
      projectId: "my-class-tv",
      storageBucket: "my-class-tv.firebasestorage.app",
      messagingSenderId: "34180660020",
      appId: "1:34180660020:web:9ced76c42ccd22189c5ae1"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      updateSyncStatus(true, "即時連線中");
    } catch (err) {
      console.warn("Firebase 初始化提示:", err);
      updateSyncStatus(false, "離線模式");
    }

    let unsubscribeCurrent = null;

    window.listenToDateRecord = function(dateStr) {
      if (!db) {
        renderAll();
        return;
      }

      if (unsubscribeCurrent) {
        unsubscribeCurrent();
      }

      const docRef = doc(db, "artifacts", "my-class-tv", "public", "data", "class_board", dateStr);
      updateSyncStatus(true, "雲端連線中");

      unsubscribeCurrent = onSnapshot(docRef, (snapshot) => {
        if (snapshot.exists()) {
          const cloudData = snapshot.data();
          window.appState.records[dateStr] = cloudData;
        } else {
          if (!window.appState.records[dateStr]) {
            window.appState.records[dateStr] = JSON.parse(JSON.stringify(DEFAULT_BOARD_DATA));
          }
        }
        renderAll();
        updateSyncStatus(true, "即時連線中");
      }, (error) => {
        console.warn("Firestore 監聽通知:", error);
        updateSyncStatus(false, "離線快取中");
        renderAll();
      });
    };

    window.saveCurrentDateToFirebase = async function(dateStr, data) {
      if (!db) return;
      try {
        updateSyncStatus(true, "廣播同步中...");
        const docRef = doc(db, "artifacts", "my-class-tv", "public", "data", "class_board", dateStr);
        await setDoc(docRef, data);
        updateSyncStatus(true, "即時連線中");
      } catch (e) {
        console.error("Firestore 儲存失敗:", e);
        updateSyncStatus(false, "儲存至本機");
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.listenToDateRecord(window.appState.currentDate);
    });
  </script>

    // 月曆彈窗控制 (週六、日紅字)
    function toggleCalendarModal() {
      const modal = document.getElementById("calendarModal");
      modal.classList.toggle("hidden");
      if (!modal.classList.contains("hidden")) {
        renderCalendarGrid();
      }
    }

    function renderCalendarGrid() {
      const y = window.appState.calendarYear;
      const m = window.appState.calendarMonth;

      const ySelect = document.getElementById("calYearSelect");
      ySelect.innerHTML = "";
      for (let yr = y - 2; yr <= y + 2; yr++) {
        const opt = document.createElement("option");
        opt.value = yr;
        opt.innerText = `${yr} 年`;
        if (yr === y) opt.selected = true;
        ySelect.appendChild(opt);
      }

      const mSelect = document.getElementById("calMonthSelect");
      mSelect.innerHTML = "";
      for (let mo = 0; mo < 12; mo++) {
        const opt = document.createElement("option");
        opt.value = mo;
        opt.innerText = `${mo + 1} 月`;
        if (mo === m) opt.selected = true;
        mSelect.appendChild(opt);
      }

      const firstDayIndex = new Date(y, m, 1).getDay();
      const totalDays = new Date(y, m + 1, 0).getDate();
      const grid = document.getElementById("calendarDaysGrid");
      grid.innerHTML = "";

      for (let i = 0; i < firstDayIndex; i++) {
        const blank = document.createElement("div");
        grid.appendChild(blank);
      }

      const todayStr = getTodayString();
      const currentSelectedStr = window.appState.currentDate;

      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayOfWeek = (firstDayIndex + d - 1) % 7;
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

        const btn = document.createElement("button");
        btn.className = `h-9 rounded-xl flex items-center justify-center font-bold text-sm transition ${
          isWeekend ? "text-red-500 hover:bg-red-50" : "text-slate-700 hover:bg-blue-50"
        }`;

        if (dateStr === currentSelectedStr) {
          btn.classList.add("bg-blue-600", "text-white");
          btn.classList.remove("text-red-500", "text-slate-700");
        } else if (dateStr === todayStr) {
          btn.classList.add("border-2", "border-amber-400");
        }

        btn.innerText = d;
        btn.onclick = () => {
          selectDate(dateStr);
          document.getElementById("calendarModal").classList.add("hidden");
        };

        grid.appendChild(btn);
      }
    }

    function changeCalMonth(delta) {
      window.appState.calendarMonth += delta;
      if (window.appState.calendarMonth > 11) {
        window.appState.calendarMonth = 0;
        window.appState.calendarYear++;
      } else if (window.appState.calendarMonth < 0) {
        window.appState.calendarMonth = 11;
        window.appState.calendarYear--;
      }
      renderCalendarGrid();
    }

    function onYearMonthChange() {
      window.appState.calendarYear = parseInt(document.getElementById("calYearSelect").value);
      window.appState.calendarMonth = parseInt(document.getElementById("calMonthSelect").value);
      renderCalendarGrid();
    }

      window.appState.currentDate = dateStr;
      if (window.listenToDateRecord) {

    function openEditorModal() {
      const data = getCurrentData();
      document.getElementById("editorDateBadge").innerText = window.appState.currentDate;
      document.getElementById("editBoardTitle").value = data.title || "三年一班 智慧大電視聯絡簿";
      document.getElementById("editDuties").value = data.duties || "";
      document.getElementById("editLifeGoal").value = data.lifeGoal || "";
      document.getElementById("editNoticeBanner").value = data.noticeBanner || "";

      renderEditLists(data);
      document.getElementById("editorModal").classList.remove("hidden");
    }

    function closeEditorModal() {
      document.getElementById("editorModal").classList.add("hidden");
    }

    function renderEditLists(data) {
      // 作業清單 (含顯示核取方塊)
      const hwDiv = document.getElementById("editHomeworkList");
      hwDiv.innerHTML = (data.homework || []).map((item, idx) => `
        <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200">
          <label class="flex items-center gap-1.5 text-xs font-bold text-slate-600 flex-shrink-0 cursor-pointer">
            <input type="checkbox" id="hw_vis_${idx}" ${item.visible !== false ? 'checked' : ''} class="w-4 h-4 rounded text-blue-600" />
            顯示
          </label>
          <select id="hw_sub_${idx}" class="p-2 border rounded-xl bg-white font-bold text-sm">
            <option value="國語" ${item.subject === '國語' ? 'selected' : ''}>國語</option>
            <option value="數學" ${item.subject === '數學' ? 'selected' : ''}>數學</option>
            <option value="英語" ${item.subject === '英語' ? 'selected' : ''}>英語</option>
            <option value="社會" ${item.subject === '社會' ? 'selected' : ''}>社會</option>
            <option value="自然" ${item.subject === '自然' ? 'selected' : ''}>自然</option>
            <option value="藝術" ${item.subject === '藝術' ? 'selected' : ''}>藝術</option>
            <option value="生活" ${item.subject === '生活' ? 'selected' : ''}>生活</option>
            <option value="閱讀" ${item.subject === '閱讀' ? 'selected' : ''}>閱讀</option>
            <option value="其他" ${item.subject === '其他' ? 'selected' : ''}>其他</option>
          </select>
          <input type="text" id="hw_txt_${idx}" value="${item.content || ''}" class="flex-1 px-3 py-1.5 border rounded-xl bg-white font-bold" placeholder="輸入作業內容..." />
          <button onclick="removeEditItem('homework', ${idx})" class="p-2 text-rose-500 hover:text-rose-700 font-bold text-lg">🗑️</button>
        </div>
      `).join('');

      // 用品清單 (含顯示核取方塊)
      const supDiv = document.getElementById("editSuppliesList");
      supDiv.innerHTML = (data.supplies || []).map((item, idx) => `
        <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200">
          <label class="flex items-center gap-1.5 text-xs font-bold text-slate-600 flex-shrink-0 cursor-pointer">
            <input type="checkbox" id="sup_vis_${idx}" ${item.visible !== false ? 'checked' : ''} class="w-4 h-4 rounded text-blue-600" />
            顯示
          </label>
          <input type="text" id="sup_txt_${idx}" value="${item.content || ''}" class="flex-1 px-3 py-1.5 border rounded-xl bg-white font-bold" placeholder="輸入必備用品..." />
          <button onclick="removeEditItem('supplies', ${idx})" class="p-2 text-rose-500 hover:text-rose-700 font-bold text-lg">🗑️</button>
        </div>
      `).join('');

      // 叮嚀清單 (含顯示核取方塊)
      const notDiv = document.getElementById("editNoticesList");
      notDiv.innerHTML = (data.notices || []).map((item, idx) => `
        <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200">
          <label class="flex items-center gap-1.5 text-xs font-bold text-slate-600 flex-shrink-0 cursor-pointer">
            <input type="checkbox" id="not_vis_${idx}" ${item.visible !== false ? 'checked' : ''} class="w-4 h-4 rounded text-blue-600" />
            顯示
          </label>
          <input type="text" id="not_txt_${idx}" value="${item.content || ''}" class="flex-1 px-3 py-1.5 border rounded-xl bg-white font-bold" placeholder="輸入生活叮嚀事項..." />
          <button onclick="removeEditItem('notices', ${idx})" class="p-2 text-rose-500 hover:text-rose-700 font-bold text-lg">🗑️</button>
        </div>
      `).join('');
    }

    function addEditItem(type) {
      const data = getCurrentData();
      if (type === 'homework') {
        data.homework.push({ id: 'h_' + Date.now(), subject: '國語', content: '', visible: true });
      } else if (type === 'supplies') {
        data.supplies.push({ id: 's_' + Date.now(), content: '', visible: true });
      } else if (type === 'notices') {
        data.notices.push({ id: 'n_' + Date.now(), content: '', visible: true });
      }
      renderEditLists(data);
    }

    function removeEditItem(type, idx) {
      const data = getCurrentData();
      if (type === 'homework') data.homework.splice(idx, 1);
      if (type === 'supplies') data.supplies.splice(idx, 1);
      if (type === 'notices') data.notices.splice(idx, 1);
      renderEditLists(data);
    }

    async function saveEditorData() {
      const data = getCurrentData();
      
      // 儲存班級自訂標題
      const newTitle = document.getElementById("editBoardTitle")?.value.trim();
      data.title = newTitle || "三年一班 智慧大電視聯絡簿";

      data.duties = document.getElementById("editDuties").value.trim();
      data.lifeGoal = document.getElementById("editLifeGoal").value.trim();
      data.noticeBanner = document.getElementById("editNoticeBanner").value.trim();

      const hwCount = (data.homework || []).length;
      for (let i = 0; i < hwCount; i++) {
        const sub = document.getElementById(`hw_sub_${i}`)?.value;
        const txt = document.getElementById(`hw_txt_${i}`)?.value;
        const vis = document.getElementById(`hw_vis_${i}`)?.checked;
        if (data.homework[i]) {
          data.homework[i].subject = sub;
          data.homework[i].content = txt;
          data.homework[i].visible = vis;
        }
      }

      const supCount = (data.supplies || []).length;
      for (let i = 0; i < supCount; i++) {
        const txt = document.getElementById(`sup_txt_${i}`)?.value;
        const vis = document.getElementById(`sup_vis_${i}`)?.checked;
        if (data.supplies[i]) {
          data.supplies[i].content = txt;
          data.supplies[i].visible = vis;
        }
      }

      const notCount = (data.notices || []).length;
      for (let i = 0; i < notCount; i++) {
        const txt = document.getElementById(`not_txt_${i}`)?.value;
        const vis = document.getElementById(`not_vis_${i}`)?.checked;
        if (data.notices[i]) {
          data.notices[i].content = txt;
          data.notices[i].visible = vis;
        }
      }

      closeEditorModal();
      renderAll();

      if (window.saveCurrentDateToFirebase) {
        await window.saveCurrentDateToFirebase(window.appState.currentDate, data);
      }
    }

    // 點擊月曆外部自動收合
    document.addEventListener("click", (e) => {
      const calModal = document.getElementById("calendarModal");
      const calToggle = document.getElementById("calendarToggleBtn");
      if (calModal && calToggle && !calModal.contains(e.target) && !calToggle.contains(e.target)) {
        calModal.classList.add("hidden");
      }
    });

    // 初始渲染看板
    renderAll();
  </script>
</body>
</html>
